<script>
import { useState } from "react";
import { Button } from "@/components/ui/button";
import { Card, CardContent } from "@/components/ui/card";
import { Input } from "@/components/ui/input";
import { Label } from "@/components/ui/label";
import { Line } from "react-chartjs-2";
import {
  Chart as ChartJS,
  LineElement,
  CategoryScale,
  LinearScale,
  PointElement,
  Legend,
  Tooltip,
} from "chart.js";

ChartJS.register(LineElement, CategoryScale, LinearScale, PointElement, Legend, Tooltip);

function poisson(lambda: number): number {
  let L = Math.exp(-lambda);
  let k = 0;
  let p = 1;
  do {
    k++;
    p *= Math.random();
  } while (p > L);
  return k - 1;
}

function runSimulation(params: any) {
  const {
    generations,
    populationSize,
    mutationsPerIndividual,
    offspringPerFemale,
    beneficialRatio,
  } = params;

  let fitnessData: number[] = [];
  let deleteriousData: number[] = [];
  let beneficialData: number[] = [];

  let population = new Array(populationSize).fill(1.0);

  for (let gen = 0; gen < generations; gen++) {
    let newPopulation = [];
    let totalFitness = 0;
    let delMutations = 0;
    let benMutations = 0;

    for (let i = 0; i < populationSize; i++) {
      let individualFitness = 1.0;
      let numMut = poisson(mutationsPerIndividual);
      for (let m = 0; m < numMut; m++) {
        if (Math.random() < beneficialRatio) {
          let effect = Math.random() * 0.001;
          individualFitness += effect;
          benMutations++;
        } else {
          let effect = Math.random() * 0.01;
          individualFitness -= effect;
          delMutations++;
        }
      }
      newPopulation.push(Math.max(individualFitness, 0));
      totalFitness += individualFitness;
    }

    population = newPopulation.sort((a, b) => b - a).slice(0, populationSize);
    let avgFitness = population.reduce((a, b) => a + b, 0) / populationSize;
    fitnessData.push(avgFitness);
    deleteriousData.push(delMutations / populationSize);
    beneficialData.push(benMutations / populationSize);
  }

  return { fitnessData, deleteriousData, beneficialData };
}

export default function MendelSimulator() {
  const [params, setParams] = useState({
    generations: 100,
    populationSize: 500,
    mutationsPerIndividual: 10,
    offspringPerFemale: 6,
    beneficialRatio: 0.00001,
  });
  const [results, setResults] = useState<any>(null);

  function handleChange(e: any) {
    setParams({ ...params, [e.target.name]: parseFloat(e.target.value) });
  }

  function handleRun() {
    const data = runSimulation(params);
    setResults(data);
  }

  const chartData = {
    labels: results?.fitnessData.map((_, i) => i + 1),
    datasets: [
      {
        label: "Mean Fitness",
        data: results?.fitnessData || [],
        borderColor: "blue",
        fill: false,
      },
      {
        label: "Deleterious Mutations/Individual",
        data: results?.deleteriousData || [],
        borderColor: "red",
        fill: false,
      },
      {
        label: "Beneficial Mutations/Individual",
        data: results?.beneficialData || [],
        borderColor: "green",
        fill: false,
      },
    ],
  };

  return (
    <div className="p-4 max-w-4xl mx-auto">
      <Card className="mb-4">
        <CardContent className="grid grid-cols-2 gap-4 p-4">
          {Object.entries(params).map(([key, val]) => (
            <div key={key}>
              <Label>{key}</Label>
              <Input
                type="number"
                name={key}
                step="any"
                value={val}
                onChange={handleChange}
              />
            </div>
          ))}
          <div className="col-span-2">
            <Button onClick={handleRun}>Run Simulation</Button>
          </div>
        </CardContent>
      </Card>
      {results && (
        <div className="bg-white p-4 rounded-xl shadow">
          <Line data={chartData} />
        </div>
      )}
    </div>
  );
}

</script>
