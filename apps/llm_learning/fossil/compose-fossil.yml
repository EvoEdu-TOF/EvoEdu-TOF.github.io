version: "3.9"

networks:
  traefik-network:
    external: true
    name: ${TRAEFIK_NETWORK}

volumes:
  fossil-repos:
  docs-data:

services:
  # Alpine package includes recent fossil releases.
  fossil:
    image: alpine:3.20
    container_name: fossil
    command: >
      sh -c "
        apk add --no-cache fossil &&
        mkdir -p /data/repos &&
        fossil server --repolist /data/repos --port 8080 --create  # serve repo index
      "
    environment:
      - TZ=${TZ}
      - CMD_DOMAIN=scm.evo-edu.org
      - CMD_PROTOCOL_USESSL=true
      - CMD_URL_ADDPORT=false
      - CMD_ALLOW_ORIGIN=['scm.evo-edu.org']
    volumes:
      - fossil-repos:/data/repos
    restart: unless-stopped
    networks: [traefik-network]
    labels:
      - traefik.enable=true
      - traefik.http.routers.fossil.rule=Host(`${FOSSIL_DOMAIN}`)
      - traefik.http.routers.fossil.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.fossil.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.services.fossil.loadbalancer.server.port=8080
      # HTTP router that redirects to HTTPS
      - traefik.http.routers.fossil-http.rule=Host(`scm.evo-edu.org`)
      - traefik.http.routers.fossil-http.entrypoints=web
      - traefik.http.routers.fossil-http.middlewares=redirect-https
      - traefik.http.middlewares.redirect-https.redirectscheme.scheme=https
  llm-project-docs:
    image: nginx:alpine
    container_name: llm-project-docs
    restart: unless-stopped
    volumes:
      - docs-data:/usr/share/nginx/html:ro
    networks: [traefik-network]
    labels:
      - traefik.enable=true
      - traefik.http.routers.projectdocs.rule=Host(`${DOCS_DOMAIN}`)
      - traefik.http.routers.projectdocs.entrypoints=${TRAEFIK_ENTRYPOINT}
      - traefik.http.routers.projectdocs.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.services.projectdocs.loadbalancer.server.port=80
      # HTTP router that redirects to HTTPS
      - traefik.http.routers.projectdocs-http.rule=Host(`llmproject.evo-edu.org`)
      - traefik.http.routers.projectdocs-http.entrypoints=web
      - traefik.http.routers.projectdocs-http.middlewares=redirect-https
      - traefik.http.middlewares.redirect-https.redirectscheme.scheme=https
